<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame picker</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #6a6a64; --line: #d9d9d3;
  --sel: #2463d1; --sel-bg: #e3ecfb; --start: #1f8a4c; --end: #c0392b; --focus: #f0a500;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecece6; --muted: #a0a097; --line: #3a3a36;
    --sel: #6c9cf0; --sel-bg: #22304a; --start: #4cc27f; --end: #ef6b5b; --focus: #f5c04a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0 0 4px; }
header p { margin: 0; color: var(--muted); font-size: 13px; }
kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 3px;
  padding: 0 4px; background: var(--bg); }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 40%); gap: 0;
  min-height: calc(100vh - 64px); }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } }
#grid { padding: 12px 16px; overflow: auto; }
.group h2 { font-size: 13px; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
.card { position: relative; display: flex; flex-direction: column; align-items: stretch;
  padding: 4px; border: 2px solid var(--line); border-radius: 6px; background: var(--panel);
  color: inherit; font: inherit; text-align: left; cursor: pointer; }
.card img { width: 100%; height: 150px; object-fit: contain; background: var(--bg);
  display: block; border-radius: 3px; }
.card .name { font: 11px ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; margin-top: 3px; }
.card .label { font-size: 12px; color: var(--muted); }
.card.selected { border-color: var(--sel); background: var(--sel-bg); }
.card.focused { outline: 3px solid var(--focus); outline-offset: 1px; }
.card .badges { position: absolute; top: 6px; left: 6px; display: flex; gap: 3px; }
.badge { font-size: 11px; font-weight: 700; padding: 0 5px; border-radius: 3px; color: #fff; }
.badge.start { background: var(--start); }
.badge.end { background: var(--end); }
.badge.note { background: var(--muted); }
.badge.check { background: var(--sel); }
#side { border-left: 1px solid var(--line); background: var(--panel); padding: 12px 16px;
  display: flex; flex-direction: column; gap: 8px; position: sticky; top: 0; max-height: 100vh;
  overflow: auto; }
@media (max-width: 820px) { #side { position: static; max-height: none; border-left: 0;
  border-top: 1px solid var(--line); } }
#preview { position: relative; align-self: center; max-width: 100%; touch-action: none;
  user-select: none; cursor: crosshair; line-height: 0; }
#pv-img { max-width: 100%; max-height: 52vh; display: block; background: var(--bg); }
#pv-rect { position: absolute; border: 2px solid var(--focus); background: rgba(240, 165, 0, 0.15);
  pointer-events: none; }
#pv-info { font: 12px ui-monospace, monospace; color: var(--muted); word-break: break-all; }
#roi-status { font-size: 12px; }
#roi-status.off { color: var(--end); }
label.note { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
#note { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); color: var(--ink); }
.buttons { display: flex; flex-wrap: wrap; gap: 6px; }
button.act { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line);
  border-radius: 4px; background: var(--bg); color: var(--ink); cursor: pointer; }
button.act.primary { background: var(--sel); border-color: var(--sel); color: #fff; }
#status { font-size: 12px; min-height: 1.4em; }
#status.warn { color: var(--end); }
#copy-text { font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all;
  margin: 0; padding: 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg);
  max-height: 30vh; overflow: auto; }
</style>
</head>
<body>
<header>
  <h1>Pick frames</h1>
  <p>Click a frame to select it, shift-click for a range. <kbd>&larr;</kbd><kbd>&rarr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd> move,
  <kbd>Space</kbd> toggles, <kbd>s</kbd> / <kbd>e</kbd> mark the start / end frame, <kbd>x</kbd> clears the marks,
  drag on the preview for a rectangle (<kbd>Esc</kbd> clears it), <kbd>c</kbd> copies. Then paste the text into the agent.</p>
</header>
<main>
  <section id="grid" aria-label="Frames"></section>
  <aside id="side">
    <div id="preview"><img id="pv-img" alt="" draggable="false"><div id="pv-rect" hidden></div></div>
    <div id="pv-info"></div>
    <div id="roi-status"></div>
    <label class="note">Note for this frame (optional)<input id="note" type="text" maxlength="400" autocomplete="off"></label>
    <div class="buttons">
      <button type="button" class="act" id="btn-start">Mark start (s)</button>
      <button type="button" class="act" id="btn-end">Mark end (e)</button>
      <button type="button" class="act" id="btn-clear-marks">Clear marks (x)</button>
      <button type="button" class="act" id="btn-clear-rect">Clear rectangle (Esc)</button>
      <button type="button" class="act" id="btn-clear-sel">Clear selection</button>
      <button type="button" class="act primary" id="btn-copy">Copy (c)</button>
    </div>
    <div id="status" role="status"></div>
    <pre id="copy-text"></pre>
  </aside>
</main>
<script type="application/json" id="vp-data">@DATA@</script>
<script>/*@LOGIC@*/</script>
<script>/*@UI@*/</script>
</body>
</html>
