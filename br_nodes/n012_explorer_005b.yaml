description: 'Agent-closed adoption loop over the n010 architecture (engine, registry,
  ledger, run surface and workflow seam unchanged): the origin table gains two READING
  origins - agent:review (0.90, a verdict from an agent that read a bounded, digest-stamped
  packet of the test''s assertion lines and the source''s symbols) and agent:author
  (0.90, the implementing agent naming a pair for a test it wrote, through `annotate
  --author`) - and the autonomous adoption floor is rewritten from ''confidence 1.0
  only'' to ''rule, measurement or reading'' (static:package, coverage, agent:*),
  so a headless profile completes level 1 on every target repo; every adopted and
  rejected row records by: human|agent:<agent-string>, run, rationale and packet_sha;
  agent rejections are evidence-revocable (a scored miss re-seeds the pair and counts
  toward readiness), agent acceptances are tolerated as the over-selecting direction
  seeds already occupy; completion.mode gains `auto` - the engine flips to the selection
  when readiness is ADMISSIBLE, records approved_by engine:readiness@<run> with mode:
  auto in costs/policy.yaml, demotes loudly as before, and a per-project cadence full_run_every
  {tasks, selection_ratio_above, days} keeps full runs and scoring alive with no person;
  the reading happens at three sites that share one verdict intake (`onboard adopt
  --agent-verdicts -`): the testmap_fresh in-gate step, the pre-review Affected Tests
  procedure''s autonomous branch, and a new bulk skill aitask-testmap-review launched
  interactively (`ait skillrun`) or, only under an explicit --headless flag, via `ait
  codeagent testmap-review` (the engine never calls a model, no default path uses
  `claude -p`); kind changes and axes stay human, headless profiles propose kinds
  and apply none; calibration (`onboard review --calibrate`) against coverage facts
  or human-reviewed rows lowers agent:review''s weight where it disagrees; design
  decisions 2 and 10 rewritten, 14-16 added.'
