description: 'The n003 synthesis with two corrections - the engine installs under
  the framework''s own per-user root ~/.aitasks/engine/v<VERSION>/ (a new AITASKS_HOME,
  legacy ~/.aitask/ tenants left in place), and the registry gains member-scoped units
  and declared variant axes so a project''s own test subdivision - thinking_app''s
  screen x matrix, where a matrix is locale x direction x geometry - is a first-class
  unit: a screen''s composable selects that screen on every matrix, values-ru/ selects
  every screen on the ru matrices only, a fail-closed Kotlin scanner escalates on
  constructs it cannot see through, and every full run scores the last prediction
  as a golden false-negative count.'
