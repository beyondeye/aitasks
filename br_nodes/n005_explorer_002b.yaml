requirements_generic_across_projects: A framework feature, generic across projects
  (aitasks, thinking_app, thinking_backend, aitasks_go, aitasks_mobile), that maintains
  a relation between source files and test units - including a project's own finer
  subdivision of a test file, such as thinking_app's screen fixtures crossed with
  its recording matrices, expressed through member units and declared axes rather
  than through project-specific code in the engine (revised)
requirements_screen_locale_subdivision: NEW - a test unit may be a member of a file
  (<path>#<member>) and may carry variants on a declared axis (<unit>@<variant>);
  a source change reaches a unit on every variant, or reaches an axis facet value
  (matrix.locale=ru) and thereby only the variants carrying it; the runner lowers
  a variant id to what it executes (for thinking_app, <Class>.<method> per matrix
  through the existing matrix_classes / preview_resolve_token routing) so the engine
  never learns Gradle, Roborazzi or the membership manifests
requirements_reason_per_selected_test: 'Translates a task''s change set into one ranked
  list of tests that must run, with a reason on every line - edge, dep, rule, axis(matrix.locale=ru)
  <- <source>, test-dep <helper>, ESCALATE:<file>|<reason> for an opaque source, a
  stale mark when a selecting edge''s digest no longer matches and no run evidence
  covers that variant, and an explicit DEFERRED line for every broad test the suite
  budget cut (revised: axis, test-dep and ESCALATE reasons)'
requirements_standard_runner_contract: 'Runs selected tests through project-defined
  runners under a standard contract (describe/list/run verbs); list emits TSV rows
  <id> <kind> <lowering> and may emit member and variant ids, run receives ids and
  lowers them, results.jsonl reports per id (a batch runner inverts its tool''s report
  - JUnit classname/name - back to ids through its own list table), and a unit: suite
  runner may emit child rows keyed to registered ids beside its verdict row; reference
  runners are built into the engine as builtin:<name> with command:/cwd: overrides,
  and a project script of the same name shadows a builtin (revised)'
requirements_cost_tracking: 'Tracks cost per test unit and per variant, keyed by host
  class, using Welford''s online update (n, mean, standard deviation, p95, last),
  plus a last_pass {sha, at, run_id} anchor and a flake rate per unit or variant (revised:
  variant rows)'
requirements_feedback_loop: Learns from failures the map did not predict via a score/attribute
  feedback loop; every full run automatically scores the newest prediction record
  for the same task and prints PREDICTION_FALSE_NEGATIVES:<n> plus one PREDICTION_MISSED:<id>
  line per miss, appending to a committed costs/predictions.yaml so a repo can cite
  its own miss history; attribute records an observed edge for a unit or member unit,
  an observed axis source for a facet value, and an observed trigger or area member
  for a broad test, merged into the registry at load (revised)
requirements_gate_enforcement: 'Enforced by gates so the map cannot rot silently:
  a procedure gate (testmap_fresh) that reviews stale annotations before the task
  commit, a check gate (testmap_check, fails rotted paths on its own) and a run gate
  (testmap_run), fail-closed with explicit waivers; only check unlocks run; a project
  whose completion invariant is a full suite (thinking_app''s verify-active as test_command)
  keeps tests_pass as the completion gate and enables testmap_run only after ait testmap
  readiness reports the declared admission criteria met (revised)'
requirements_agent_skill: 'Agent skills teach agents how to keep the map current as
  they write code and tests: annotate (file, member or axis), attribute, waive, verify
  after editing an annotation, confirm or retarget digest stamps in the procedure
  gate, and drive a project''s own render loop from select --format tokens (revised)'
requirements_go_engine_and_cli: 'The engine and CLI are one static Go binary (ait-testmap)
  built from engine/; bash keeps only the dispatcher arm, the shim that resolves the
  binary under $AITASKS_HOME and pipes the change surface in, the two gate verifier
  shells, the ait engine developer verbs and any project-local runner scripts; the
  binary never invokes aitask_*.sh (revised: root variable)'
requirements_go_engine: 'Scan, check, select and stale finish in well under a second
  on a ~720-test repo - and select stays under 250 ms on thinking_app''s ~300 golden
  variants plus ~370 JVM classes with axis expansion - and the scheduler runs concurrently
  with real cross-process locks, so selection overhead stays negligible against the
  shortest test and check can run at every commit step (revised: variant target added)'
requirements_platform_binaries_in_release: Release CI builds and attaches checksummed
  binaries for linux/darwin x amd64/arm64 (ait-testmap_<V>_<os>_<arch> + ait-testmap_<V>_SHA256SUMS.txt)
  from one engine job that also runs go vet and go test; a new engine-check.yml runs
  the same on push/PR for engine/**; tarball and package-manager artifacts stay architecture-independent
requirements_user_root: NEW - every per-user artifact this feature installs lives
  under the framework's own root, ~/.aitasks/ (env override AITASKS_HOME), beside
  the existing ~/.config/aitasks/ and ~/.cache/aitasks/ roots; the engine is the root's
  first tenant at $AITASKS_HOME/engine/v<VERSION>/ and $AITASKS_HOME/engine/dev/;
  the legacy ~/.aitask/ tenants (venv, python, bin, uv, dev_tier, update_check) are
  neither moved nor read by this feature
requirements_engine_packaging: 'ait setup and ait upgrade (through install.sh''s --source-only
  path) install the host''s binary under $AITASKS_HOME/engine/v<VERSION>/ with checksum
  verification, a .sha256 sidecar and a version --json self-check; fallbacks --local-engine,
  --engine-from-source, AIT_TESTMAP_BIN; opt-out --no-testmap / AIT_TESTMAP_FETCH=0
  (revised: root)'
requirements_dev_rebuild_from_source: 'A framework developer rebuilds the engine with
  one command (ait engine build) through the same engine/build.sh that CI uses, into
  $AITASKS_HOME/engine/dev/ which the shim selects via AIT_ENGINE=dev (version must
  read <V>-dev+<sha>); ait engine cross produces the CI matrix locally, byte-identical
  (revised: root)'
requirements_engine_dev_regeneration: 'The GOOS/GOARCH matrix, CGO_ENABLED=0 and ldflags
  live in one script (engine/build.sh) shared by release CI, ait engine build and
  ait engine cross; ait engine test runs go vet and go test; ait engine prune removes
  versions under $AITASKS_HOME/engine/ that no registered project is on (revised:
  root)'
requirements_annotation_freshness: 'Every unit coverage annotation carries the date
  and a blob digest of the covered source at confirmation; committed last_pass anchors,
  per variant where a unit has variants, let stale prove a test already passed against
  a changed source''s current content (EVIDENCED) so most hot-source churn needs no
  rewrite; a procedure gate at the post-implementation step hands the report to an
  agent that fixes annotations before the task commit (revised: per-variant evidence)'
requirements_annotation_staleness: A stale verb reports, for a task's change set or
  repo-wide, STALE_PATH (deleted or renamed source, fail-closed), STALE (content changed,
  no evidence on every reached variant), EVIDENCED, UNSTAMPED, STALE_AREA and opt-in
  REVIEW_DUE rows in the framework's fixed line protocol; digest comparison needs
  no git history, evidence only removes nags
requirements_high_level_tests_separate: 'Integration, e2e and device tests declare
  areas, scope globs or budget-exempt trigger globs instead of covers, live in registry/_scoped.yaml
  beside the unit table, join the ranked list at distance 1 as sinks, and never enter
  the per-file edge graph or its digest staleness; a helper file may declare testmap:reads
  <glob> so every unit whose test-file closure contains it inherits the glob as a
  trigger (revised: reads)'
requirements_broad_test_handling: Scoped rows are ranked after unit tests at equal
  distance, selected under an explicit suite budget that prints every DEFERRED cut,
  scheduled only after the unit wave is green (broad_after_unit), widened by attribute
  on a full-run miss, and drift-flagged by evidence (STALE_AREA) rather than by calendar
assumption_static_granularity_v1: 'Static file-level facts remain the default for
  v1, with two narrower granularities now in use rather than reserved: a member unit
  (<path>#<member>, annotations scoped by testmap:unit blocks, no language parsing)
  and the edge''s symbols slot, whose first consumer is the opt-in android-res scanner
  that names the string keys a values-<q>/ diff changed; no scanner produces symbol-level
  coverage of Kotlin or Python code (revised)'
assumption_change_surface_is_intake: 'The change-surface script''s attribution (aitask_change_surface.sh)
  is the right intake; its exit codes carry no meaning, so the shim pipes its COMMITTED:/TASK:/OTHER:/UNKNOWN:
  lines into the engine''s --changes - and the engine parses lines only; selection
  never reads a raw git diff, and an UNKNOWN path refuses selection and drives the
  stale decision; the before content a symbol scanner needs comes from HEAD:<path>
  (TASK: rows) or the parent of the first (t<id>) commit (COMMITTED: rows) and is
  absent - so the whole file is the symbol set - when history is unreachable'
assumption_existing_locks_wrappable: Existing project locks and allocators (thinking_app's
  heavy-run lock, emulator allocation) can be wrapped as resources without changing
  them; the Go admission and allocator kinds exec the project's commands and honour
  their exit codes, deferring on 75 until the run deadline
assumption_batch_per_unit_timing_reportable: Runners can report per-unit timing inside
  a batch from their tool's own report format (JUnit XML, go test -json, pytest junitxml)
  and can invert a report row to a registered id - JUnit classname+name back to ScreenFixtures.kt#Welcome@pixel5Ru_ltr
  through the same routing table the runner's list verb printed; the builtin runners
  parse these in Go (revised)
assumption_target_repos_accept_aitestmap_root: Every target repo will accept a root
  aitestmap/ directory of YAML committed into its code tree, including an optional
  axes.yaml; runner scripts are optional because the reference runners are built into
  the engine, and thinking_app commits one (tools/verification/testmap_runner.sh)
  because its lowering is the harness's own routing
assumption_testmap_token_no_collision: The annotation token 'testmap:' does not collide
  with existing prose comments in any target repo; the 38 existing '# Covers:' headers
  in aitasks are behavioural prose and are not matched; thinking_app's KDoc mentions
  no 'testmap:' string
assumption_gate_exit_contract_reused: The framework verifier contract (0 pass / 1
  fail / 2 skip / 3 error) is reused through two dedicated verifier shells, not through
  gate_command_exit_contract, which maps only command exits 0/1/2; runner exit 75
  (admission refused, a thinking_app code absent from the framework) is deferred inside
  the engine and a final 75 maps to verifier 3; only an empty selection maps to 2;
  a missing engine maps to 3, never skip
assumption_go_toolchain_available: 'A Go toolchain >= 1.26 is available in release
  CI through an actions/setup-go step this design adds to release.yml (go-version-file:
  engine/go.mod) and on framework developers'' machines; target-project users never
  need Go'
assumption_go_toolchain_ci_and_dev_only: Go is a build-time dependency only - release.yml
  has no Go step today and the repo's only setup-go is hugo.yml's at website/go.mod's
  1.25.7, so the engine job provisions its own toolchain; users receive prebuilt binaries
  and never compile
assumption_release_asset_reachable: A host running ait setup or ait upgrade can reach
  github.com/beyondeye/aitasks/releases over HTTPS, as it already must for the framework
  tarball; the shim itself never downloads, so a gate run never performs a network
  fetch
assumption_release_assets_reachable: 'Air-gapped or off-matrix hosts supply the binary
  via --local-engine, --engine-from-source, AIT_TESTMAP_BIN or a pre-seeded $AITASKS_HOME/engine/;
  --no-testmap / AIT_TESTMAP_FETCH=0 skip the fetch and nothing else in setup depends
  on it (revised: root)'
assumption_git_history_is_freshness_clock: Git history is the evidence clock, not
  the staleness key - commit reachability (merge-base --is-ancestor) decides which
  last_pass anchors may suppress a STALE row, never whether an edge is stale; mtime
  is never compared; a shallow clone whose anchors are outside fetched history reports
  STALE, not EVIDENCED, and remains fully functional
assumption_passing_run_anchors_edges: 'A passing run of a test variant at commit C,
  on any host class, from an invocation without a cause and for a unit under the flake
  threshold, is evidence that its annotated edges held for that variant against the
  source content present in C''s tree - so an edge whose current blob equals the blob
  at C is EVIDENCED for that variant without touching the test file; a unit with variants
  is EVIDENCED only when every variant the change reaches has such a pass (revised:
  per variant)'
assumption_areas_express_suite_blast_radius: 'The blast radius of a high-level test
  is expressible as a union of area glob sets plus scope globs plus budget-exempt
  trigger globs, plus the reads globs of helpers in its test-file closure; what that
  misses surfaces through score on a full run as an observed trigger or area member
  (revised: reads)'
assumption_engine_latency_targets: On the aitasks repo (about 720 test units, 2,500-3,000
  edges, about 270 scanned sources) the engine meets select < 200 ms warm, scan <
  300 ms, check < 300 ms, stale --task < 300 ms, stale --all < 2 s, cold select <
  1.5 s; on thinking_app (about 300 golden variants over 49 member units, about 370
  JVM classes, about 900 Kotlin files) select with axis expansion < 250 ms warm; pinned
  by committed go test -bench fixtures with a 2x regression failing engine-check.yml,
  validated before the gates are enabled (revised)
assumption_platform_matrix_sufficient: linux/darwin x amd64/arm64 covers every target
  host (WSL reports Linux); any other platform builds from source via --engine-from-source
assumption_blob_digest_is_staleness_key: The git blob digest of the covered source's
  content is the staleness key; file mtime (reset by checkout) and the annotation
  date (day granularity, clock skew) are never compared - the date is display only;
  the blob id doubles as the join key into any commit's tree for the evidence join
assumption_broad_tests_area_scoped: Integration, e2e and device tests can be described
  by named areas or globs whose membership changes rarely, so evidence-based drift
  (STALE_AREA) plus attribute widening is adequate; a calendar cadence (REVIEW_DUE,
  broad_review_days) is opt-in and off by default
assumption_one_engine_per_framework_version: 'One engine build per framework version
  suffices; a per-user versioned directory ($AITASKS_HOME/engine/v<VERSION>/) resolves
  per-project VERSION differences without a compatibility matrix, and exact-version
  resolution in the shim never falls back to newest-wins (revised: root)'
assumption_variant_universe_from_runner_list: 'NEW - a runner''s list verb enumerates
  the complete universe its run filter can address, so whole-run selection is sound:
  for thinking_app that is every <Screen>_<matrix>.png of the two membership manifests
  (primary-catalog-expected.txt, secondary-matrices-expected.txt: 50 + 247 goldens
  over 10 matrices) as variant ids plus every other class under app/src/test/java
  as a file unit; a class absent from list is a check failure (unregistered test),
  never a silently unfiltered one'
assumption_axis_sources_declarable: 'NEW - the sources that reach one facet value
  of an axis are declarable as globs in axes.yaml: for thinking_app''s locale facet,
  values-<q>/**, raw-<q>/** and the per-family fonts (heebo_* for he, roboto_* for
  en and ru, cairo_* for ar); sources every locale reads (values/**, TypeScale.kt,
  Fonts.kt, AppRoot.kt) are ordinary edges or scanned dependencies and reach every
  variant; the geometry and direction facets have no axis sources because they are
  test-side constants in ScreenshotTestHarness.kt, reached through the test-dep closure'
assumption_kotlin_scanner_fail_closed: NEW - a closed construct list (explicit repo
  import, same-package as fully connected, repo star import as a package edge, fully-qualified
  in-body reference from the comment-stripped body) is enough to over-approximate
  the Kotlin import graph, and every construct that defeats such a graph - inline
  functions, const val, Hilt/DI bindings, Class.forName / ::class.java, generated
  or KSP sources, an unreadable or untokenizable file - is detectable by pattern and
  marks the file opaque, so a change to it escalates instead of being silently narrow;
  each opaque branch is reachable and red-proved by an engine fixture test
assumption_legacy_user_root_coexists: NEW - ~/.aitasks/ (this feature) and ~/.aitask/
  (venv, python, bin, uv, dev_tier, update_check; 49 framework files name it) can
  coexist on one host without either reading the other; migrating the legacy tenants
  under AITASKS_HOME is a separate, later change, and nothing in this feature depends
  on it happening
component_registry_loader: 'Registry loader and writer (internal/registry): merges
  aitestmap/registry/*.yaml plus axes.yaml into six tables (edges, scopes, areas,
  rules, waivers, axes); unit ids follow <path>[#<member>][@<variant>], with variants
  materialised at load from each runner''s list output and validated against the axis''s
  value set; owns: routing by glob for edges and rules and by area name for hand-declared
  scopes; write routing (scan --apply -> _scanned.yaml and _scoped.yaml, attribute
  -> observed.yaml, declare -> the owning hand file); deterministic sorted writes
  only on change; check rules incl. STALE_PATH, UNSTAMPED past bootstrap under require_stamp,
  DEAD_SCOPE, DEAD_AXIS_SOURCE (an axis glob matching nothing), UNKNOWN_VARIANT (a
  listed variant outside the axis), KIND_MISMATCH|CONVERT_TO_SUITE above unit_covers_max,
  CONTRACT_MISMATCH; golden tests pin the merge rule (revised)'
component_annotation_scanner: 'Annotation scanner and rewriter (internal/annot): grammar
  v3 - testmap:unit <Member> opens a member block that owns every following testmap:
  line until the next testmap:unit or end of file (a file-level block precedes the
  first unit); testmap:kind, testmap:covers <path> @<date>/<blob10>, testmap:area,
  testmap:scope, testmap:trigger, testmap:reads <glob> (helper files only), testmap:reviewed,
  runner/needs/batch - per comment leader and Python module docstrings; refuses unknown
  keys with a line number; the line-targeted rewriter edits stamps by (file, line,
  current text) and refuses on REWRITE_CONFLICT; produces both generated files from
  every runner''s list output (revised: unit blocks, reads)'
component_dependency_scanners: 'Dependency scanners (internal/deps): built-in bash,
  python, go (go list -deps -json cached by go.sum digest), kotlin and Gradle module-graph
  scanners plus executable plugins under aitestmap/scanners/ speaking one JSON line
  per file {file, deps, opaque?, reads?}; the kotlin scanner runs over main and test
  roots, handles a closed construct list and marks every other file opaque:<reason>;
  the opt-in android-res symbol scanner indexes R.string.<key>, stringResource(R.string.<key>)
  and "<key>".localized() sites per Kotlin file and, given a before blob, the keys
  a values-<q>/ diff changed; forward deps cached per source blob under ${XDG_CACHE_HOME:-~/.cache}/aitasks/testmap/deps/<blob-sha1>.json
  and inverted in memory (revised)'
component_selector: 'Selector (internal/selectr, internal/changesurface): line-protocol
  intake via --changes - or a file, refusing on UNKNOWN:; the graded walk with select/implies/escalate
  rules; variant expansion (an edge to a unit selects every variant; an axis hit selects
  the variants carrying the facet value; a symbol-narrowed axis hit selects only the
  member units whose closure names a changed key); test-dep at d1 when a changed file
  is in a unit''s own test-file closure, including reads globs; ESCALATE:<file>|<reason>|<runner-set>
  for a changed opaque file; scoped join at d1; ranking by distance then kind then
  cost; stale marks from digest compare plus per-variant evidence join; --include-stale;
  suite budget with DEFERRED lines and budget-exempt triggers; --format lines|json|tokens
  (tokens = the runner''s declared token_format, e.g. <matrix>:<Screen>); prediction
  record; explain (revised)'
component_runner_contract: 'Runner contract and repository (internal/runner): describe
  (adds axis:, token_format:), list as TSV <id> <kind> <lowering> with member and
  variant ids, run --manifest with ids and their lowerings, results.jsonl per id with
  optional child rows under a suite parent, runner.json, first-match bindings and
  per-test override, the builtin: scheme with command:/cwd: overrides and shadow-by-name,
  batching by (runner, resource set, batch flag), per-unit timeouts, units_expected/units_reported
  reconciliation per id, exit contract 0/1/2/75 plus 64 (revised)'
component_scheduler_resources: 'Scheduler and resources (internal/sched): kinds mutex/semaphore/admission/allocator,
  scopes host/worktree/run, acquired_by planning; flock(2) slot files taken in canonical
  order; admission exec with 75 deferral and backoff to the run deadline; allocator
  exec with signal-safe release; goroutines under errgroup; batching (variants of
  one runner batch into one invocation, so thinking_app''s whole selection is one
  Gradle run); broad_after_unit waves; config concurrency: serial|parallel defaulting
  to serial at bootstrap with --serial/--parallel overrides; the schedule report and
  its check half'
component_cost_ledger: 'Cost ledger (internal/cost): Welford per (id, host class)
  where id may be a variant, with P2 p95 and last; per-repo ledger .aitask-testmap/ledger.jsonl
  with run_id/id/status/duration_ms/head_sha per result; costs --update folds into
  aitestmap/costs/<hostclass>.yaml and truncates; per-invocation overhead rows; last_pass
  {sha, at, run_id} per id and a flake rate with flake_threshold; per-kind estimates;
  costs/predictions.yaml holds the last 200 scored full runs {run_id, prediction_run_id,
  task, predicted, false_negatives, missed[]} (revised)'
component_evidence_join: 'Evidence join (internal/stale + internal/gitx, reads internal/cost):
  for every edge whose stamped_blob differs from the current blob, collects last_pass
  shas per reached variant from the local ledger and committed costs (any host class),
  drops candidates from invocations with a cause or ids over the flake threshold,
  keeps shas that are ancestors of HEAD, and runs one git ls-tree per distinct sha;
  an edge is EVIDENCED when every reached variant has a sha whose source object id
  equals the current blob, otherwise STALE with the unevidenced variants listed; never
  rewrites - stale --confirm-evidenced is the explicit re-stamp and the only bulk
  confirmation an autonomous profile may run (revised: per variant)'
component_feedback_tools: 'Feedback tools (internal/feedback): score splits a full
  run''s failures into caught/missed for unit, variant and scoped rows against a prediction
  record; run --all and any unit: suite runner run auto-invoke score against the newest
  prediction for the same task and print PREDICTION_FALSE_NEGATIVES:<n> plus PREDICTION_MISSED:<id>
  lines, appending to costs/predictions.yaml; attribute records missing-edge/test-wrong/source-wrong
  for units and members, missing-axis-source for a facet value, missing-trigger/area-too-narrow
  for scoped rows, with task and run id, in registry/observed.yaml; readiness prints
  the run-gate admission facts (revised)'
component_gates: 'Gates: three entries in gates_reference.yaml synced to gates.yaml
  - testmap_fresh (kind: procedure, verifier aitask-gate-testmap-fresh, no unlocks),
  testmap_check (machine, max_retries 0, timeout 120, unlocks [testmap_run]), testmap_run
  (machine, blocks_dependents, max_retries 1, timeout 1800); two bash verifiers on
  the tests_pass template mapping engine exits 0/1/2/75/64 and a missing engine to
  verifier 0/1/2/3/3/3; a project declares run_gate_admission in config.yaml and ait
  testmap readiness reports it, so a repo whose completion gate is a full suite keeps
  tests_pass and adds testmap_run only once admissible (revised)'
component_skill: 'Skills: aitask-testmap teaches annotate (covers on a file or a testmap:unit
  member, or area/scope/trigger/reads), declaring an axis value''s sources in axes.yaml,
  attribute before the gate, verify after editing an annotation, classify --suggest,
  and driving a project render loop from select --format tokens (thinking_app: piped
  into screenshot-tests.sh preview); aitask-gate-testmap-fresh is the procedure gate
  that runs stale --task, shows git diff <stamped_blob> <current_blob> per STALE row
  with the unevidenced variants, retargets STALE_PATH rows, re-stamps EVIDENCED rows,
  prompts on UNSTAMPED rows past bootstrap, never guesses UNKNOWN and never confirms
  a STALE row autonomously; Claude Code first, then ported (revised)'
component_reference_runners: 'Reference runners built into the binary as ait-testmap
  runner <name>: bash-file, pytest (junitxml; testmap:batch no honoured), go-test
  (per-file -run regex, -json), gradle-class (--tests <lowering> batch, JUnit XML
  inverted to ids through the list table), suite (any command as one unit, optional
  child rows from a project post-processor), device (allocator handle); command:/cwd:
  overrides in runners.yaml; a project script of the same name shadows a builtin and
  explain shows which won; thinking_app ships tools/verification/testmap_runner.sh
  (screen-matrix: list from the two membership manifests + matrix_classes, run through
  screenshot-tests.sh unit-tests --tests) and wraps verify-active as a suite runner
  whose child rows come from lib/screenshot-diff-set.sh (revised)'
component_variant_axes: 'NEW - Variant axes (internal/axes, read by registry, selectr,
  runner, cost): aitestmap/axes.yaml declares axes {name, facets[], values{value:
  {facet: v}}, sources{facet: {v: [globs]}}}; a runner''s describe names the axis
  its variants live on and a token_format; list emits <unit>@<value> ids; the selector
  joins changed paths to facet values through sources and selects the variants carrying
  them (reason axis(<axis>.<facet>=<v>) <- <path>), or every variant of a unit reached
  by an edge, dep, rule or test-dep; costs, last_pass, evidence and score are per
  variant; check enforces DEAD_AXIS_SOURCE and UNKNOWN_VARIANT; the engine holds no
  project axis - the first consumer is thinking_app''s matrix axis with facets locale/direction/geometry
  over its 10 recording matrices'
component_go_engine: 'Go engine and CLI: engine/cmd/ait-testmap with internal/{registry,axes,annot,deps,changesurface,selectr,sched,runner,cost,feedback,stale,gitx,platform};
  Go 1.26 with pinned toolchain, CGO_ENABLED=0, -trimpath -buildvcs=false -ldflags
  -s -w -X version/commit/contract; deps gopkg.in/yaml.v3, bmatcuk/doublestar/v4,
  golang.org/x/sync only; stdlib flag verb table, syscall.Flock, os/exec git; line-protocol
  stdout, --json, per-verb exit contracts; never writes aitasks/, aiplans/, .aitask-data/
  or a gate ledger and never invokes aitask_*.sh; tests against fixture repos in t.TempDir()
  including one fixture per opaque-scanner branch (revised: axes package, opaque fixtures)'
component_binary_distribution: 'Binary distribution: engine/build.sh as the single
  build and matrix command; the engine job in release.yml (setup-go from engine/go.mod,
  go vet, go test, build.sh all) producing ait-testmap_<V>_{linux,darwin}_{amd64,arm64}
  and ait-testmap_<V>_SHA256SUMS.txt attached by both action-gh-release steps with
  release needs: [plan, engine]; the unchanged VERSION-matches-tag guard; a new engine-check.yml
  on push/pull_request for engine/**; lib/platform_detect.sh; the shim''s strict handshake
  (AIT_TESTMAP_BIN with override notice > AIT_ENGINE=dev slot at $AITASKS_HOME/engine/dev/
  requiring <V>-dev+<sha> > $AITASKS_HOME/engine/v<V>/ requiring == VERSION > ENGINE_MISSING
  exit 3 with repair hint); tests test_testmap_shim.sh, test_platform_detect.sh and
  test_aitasks_home.sh; aidocs/framework/go_engine.md, a CLAUDE.md Engine block and
  a packaging_strategy.md paragraph; release-packaging.yml and nfpm arch: all untouched
  (revised: root)'
component_engine_binary: 'Engine binary identity and budget: embeds version, commit
  and contract; version --json is the install-time self-check and also prints the
  resolved ENGINE:<path>; fixed-prefix structured output and --json; CONTRACT_MISMATCH
  refusal on registry files from a newer contract (contract 1 covers axes.yaml and
  member ids); performance budget pinned by go test -bench on golden registries for
  aitasks and a thinking_app-shaped fixture with a 2x regression failing CI; scanner
  and dependency pools capped at 8 (revised)'
component_user_root: 'NEW - Per-user root: .aitask-scripts/lib/aitasks_home.sh exports
  AITASKS_HOME=${AITASKS_HOME:-$HOME/.aitasks} and aitasks_engine_dir <version|dev>;
  sourced by the shim, aitask_setup.sh''s install_engine_binary, aitask_engine.sh
  and the verifiers; never falls back to ~/.aitask/; ait setup creates $AITASKS_HOME/engine/
  with mode 0755 and prints AITASKS_HOME:<path> in its summary beside the venv line
  so both roots are visible; ait engine prune walks only $AITASKS_HOME/engine/v*/;
  test_aitasks_home.sh pins the default, the env override, and that no framework script
  under this feature names ~/.aitask/'
component_engine_packaging: 'Engine install and developer regeneration: install_engine_binary()
  in aitask_setup.sh, reached by ait setup and by ait upgrade through install.sh''s
  --source-only path beside install_global_shim; uname mapping; .sha256 sidecar short-circuit;
  source order --local-engine > exact-version release asset > --engine-from-source
  > ENGINE_MISSING warning; sha256sum -c / shasum -a 256; atomic install to $AITASKS_HOME/engine/v<V>/;
  version --json must echo <V>; .dev-marked binaries never overwritten without --force-engine;
  --no-testmap / AIT_TESTMAP_FETCH=0 print TESTMAP_BINARY:skipped; .aitask-testmap/
  gitignored by setup (the per-repo .aitask-* family is unchanged); aitask_engine.sh
  with ait engine build|test|cross|prune; tests/test_install_engine_binary.sh through
  a real install.sh --dir --local-engine asserting the $AITASKS_HOME path (revised:
  root)'
component_freshness: 'Freshness: the per-edge @<date>/<blob10> stamp written only
  by verify, annotate and stale --confirm*, scoped to a member block where the unit
  is a member; last_pass anchors per id in the ledger and committed costs; the verify
  verb and verify --all-evidenced; config bootstrap_until, require_stamp, flake_threshold;
  the testmap_fresh procedure gate dispatched by the existing procedure-gate block
  before the change summary; the aitask-gate-testmap-fresh skill; not a git hook and
  not a Claude Code hook (revised: member scope)'
component_suite_registry: 'Scoped-row registry and areas: registry/areas.yaml plus
  areas: blocks in hand files (seedable via areas --import-codemap); registry/_scoped.yaml
  rows {test, kind, runner, areas, globs, triggers, reads_from, needs, reviewed_at,
  line} where reads_from lists the helper files whose testmap:reads globs the row
  inherited; owns: by area name for hand-declared rows; the d1 join, kind ranking,
  suite budget (suite_budget_s default 600) with DEFERRED lines and budget-exempt
  triggers; check rules incl. DEAD_SCOPE and KIND_MISMATCH|CONVERT_TO_SUITE; ait testmap
  areas and classify --suggest; missing-trigger / area-too-narrow in attribute; a
  rule may select: a scoped test by name (revised: reads_from)'
component_staleness_tool: 'Staleness tool (internal/stale): stale --task --changes
  - | --all prints SURFACE/EDGES/STALE_PATH/STALE/EVIDENCED/UNSTAMPED/STALE_AREA/REVIEW_DUE/UNKNOWN/DISPLAY/DECISION
  lines with %25/%7C encoding; a STALE row on a unit with variants carries a trailing
  |<unevidenced variants> field; content states exit 0, --strict exits 1 on STALE_PATH;
  compares blob digests of the working tree only, consults the per-variant evidence
  join, adds rename hints and culprit task ids from git log --name-status -M when
  history is reachable; mutates stamps via --confirm, --confirm-source, --confirm-evidenced,
  --retarget through the rewriter with a re-scan of touched files (revised)'
component_broad_test_scopes: 'Broad-test scheduling and staleness policy: kind integration|e2e|device
  selects the scoped association form; broad_after_unit: true waves run scoped rows
  only after a green unit wave; device_policy: filter_by_resource default; scoped
  rows are exempt from per-edit digest staleness, with STALE_AREA as the evidence-based
  drift signal and REVIEW_DUE as an opt-in cadence; attribute widens areas by evidence;
  covers on a scoped row is allowed for digest-stamped fixture pins; a suite row (thinking_app''s
  verify-active) may report child rows so its goldens feed evidence and the prediction
  ledger without being selected individually'
tradeoff_computed_vs_prose: 'Advantage: selection is computed, explained and scored
  rather than remembered; blast radius becomes data instead of prose - including the
  "localized screen change may use preview, shared component must run the full gate"
  rule, which becomes an axis join plus an import-scanner fan-out that select prints
  with a reason per variant'
tradeoff_fail_closed_bootstrap_cost: 'Disadvantage: fail-closed enforcement means
  bootstrapping each repo requires an explicit waiver pass before testmap_check can
  be enabled and a first green full run before require_stamp and --strict are turned
  on; a repo with a whole-suite completion gate additionally needs the readiness criteria
  met before testmap_run gates anything; mitigated by check --strict off until enabled,
  bulk stamping via stale --all --confirm-evidenced, and the ledger filling itself
  from the full runs the repo already performs'
tradeoff_static_scanner_overselection: 'Disadvantage: static scanners overselect on
  hot files and cannot see runtime coupling; a shared component (thinking_app''s ui/components/*)
  fans out to most screens on every matrix, which is the correct answer and close
  to a full run; kind ranking, the suite budget and --budget-s trim scoped rows first,
  the android-res symbol scanner narrows a catalog edit to the screens naming the
  changed keys, and a project scanner plugin can narrow a hot resource file'
tradeoff_resource_declaration_completeness: 'Risk: declared resources are only as
  complete as the declarations; an undeclared interference is invisible until a full
  run or a probe finds it; serial-by-default at bootstrap means declarations are reviewed
  in the schedule report before concurrency is trusted'
tradeoff_registry_directory_complexity: 'Disadvantage: a merged registry directory
  needs more CLI logic than a single file would - now six tables, two generated files
  and an id grammar with member and variant fragments; kept to one directory with
  one merge rule in one Go package with golden tests, and the axis table is empty
  for every project that declares none'
tradeoff_attribution_risk: 'Risk: an agent that edits sources without attributing
  produces a map that looks current and is not; narrowed - such a source shows as
  STALE in the next task touching it and as a stale mark on every selection, and in
  a repo that runs a full suite at completion every miss is counted by the automatic
  score - but a new coupling with no edge at all is still only caught on a full run'
tradeoff_batch_misreport_risk: 'Risk: a batch runner that misreports per-unit results
  corrupts attribution, cost and evidence (a false pass could manufacture an EVIDENCED
  row); the inversion from JUnit classname/name to variant ids is a second place a
  runner can misreport; mitigated by units_expected/units_reported reconciliation
  per id, a row that inverts to no registered id being a mechanism failure, and no
  line from an invocation with a cause ever anchoring'
tradeoff_two_toolchains: 'Disadvantage: bash and Go in one framework; mitigated by
  the boundary rule (parse/walk/match/digest/schedule in Go; gate ledger, task file
  and shell environment in bash; builtins exec configured commands and never source
  shell state), the engine-check.yml job, and Go source confined to engine/ and excluded
  from the tarball so target projects never need Go'
tradeoff_setup_network_fetch: 'Disadvantage: ait setup gains the framework''s first
  self-downloaded release asset; mitigated by reusing the CDN URL family install.sh
  already uses, SHA256SUMS verification, the .sha256 sidecar, --no-testmap / AIT_TESTMAP_FETCH=0,
  the shim never fetching on its own, and setup never depending on the binary for
  anything else'
tradeoff_area_glob_coarseness: 'Disadvantage: area and scope globs are coarser than
  edges - a broad area over-selects its tests on every edit inside it and a scoped
  test depending on a file outside its scope is under-selected until a full run scores
  it; mitigated by the suite budget with explicit DEFERRED lines, budget-exempt triggers
  and reads globs for known sharp edges, and the missing-trigger / area-too-narrow
  attribution path'
tradeoff_flaky_pass_anchors: 'Risk: a flaky pass anchors evidence as surely as a real
  one; mitigated by per-run status in the ledger so costs exposes a flake rate per
  id, and an id above flake_threshold is excluded from the evidence join'
tradeoff_strict_version_handshake: 'Risk: the binary must match .aitask-scripts/VERSION
  exactly, so an ait upgrade on a host that cannot fetch leaves ait testmap refusing
  to run until a matching binary is supplied; intended fail-closed behaviour, and
  the error names the fix (ait setup, AIT_TESTMAP_BIN, ait engine build) and the $AITASKS_HOME
  path it looked in'
tradeoff_engine_speed_enables_per_task_use: 'Advantage: sub-second select/check/stale
  on a 720-test repo, and sub-250 ms select over 300 variants, makes selection overhead
  negligible against the shortest test and lets check run at every commit step; a
  bash+Python engine would spend seconds in start-up and YAML parsing first'
tradeoff_real_scheduler: 'Advantage: goroutines plus flock(2) give correct cross-worktree
  contention and a critical-path report; the shell suite and the pytest lane get the
  enforced do-not-overlap that is only a comment today, once a project flips concurrency
  from the serial bootstrap default after reviewing the schedule report'
tradeoff_noarch_packages_preserved: 'Advantage: Homebrew, AUR, .deb, .rpm and the
  tarball ship nothing compiled; the per-arch concern is contained in one release
  job and one setup function'
tradeoff_compiled_component_cost: 'Disadvantage: the framework gains a compiled component
  - contributors touching the engine need Go, a release fails if go test fails, install
  gains a fetch and checksum step; mitigated by a single build.sh matrix, ait engine
  build, and the engine being optional until a testmap gate is enabled'
tradeoff_engine_version_skew: 'Disadvantage: one user with several projects on different
  framework versions keeps several ~10 MB binaries under $AITASKS_HOME/engine/; mitigated
  by exact-version resolution in the shim (never newest-wins) and ait engine prune
  against the project registry, never a count-based prune'
tradeoff_stamp_churn: 'Disadvantage: confirming stamps rewrites test files, so a source
  named by 72 tests could yield a 72-file diff; mitigated - EVIDENCED rows need no
  rewrite until someone chooses --confirm-evidenced, --confirm-source makes a deliberate
  re-stamp one commit, only confirmation rewrites, member blocks keep a screen''s
  stamps in one file (ScreenFixtures.kt) so thinking_app''s fan-out is a one-file
  diff, and KIND_MISMATCH nudges fan-out toward a scope'
tradeoff_broad_scope_coarseness: 'Disadvantage: a test scoped to a large area is selected
  for any change inside it; mitigated by ranking last at its distance, running only
  after a green unit wave, being cut first by the suite budget with the cut printed
  as DEFERRED, and the cost visible in schedule'
tradeoff_autonomous_confirmation_weak: 'Risk: treating a green test as evidence that
  a coverage claim still holds is weaker than review; narrowed - the only autonomous
  confirmation is --confirm-evidenced, which requires a pass on every reached variant
  whose tree held the current bytes of the specific source, records confirmed_by:
  <run_id>, and is re-opened by a later score miss; a STALE row is never confirmed
  without a human'
tradeoff_engine_absent_on_host: 'Risk: an unsigned macOS binary or a blocked download
  leaves a host without an engine; mitigated by ENGINE_MISSING naming the $AITASKS_HOME
  path and repair verb, --engine-from-source and --local-engine fallbacks, and the
  testmap gates exiting 3 (error), never skip, when the engine is absent'
tradeoff_evidence_requires_reachable_history: 'Risk: the evidence join can only suppress
  a STALE row when the anchoring commit is reachable, so a depth-1 CI clone or a fresh
  shallow worktree sees the precise digest verdict with no self-healing; the safe
  direction, and the reason --strict fails only on STALE_PATH; a repo-wide stale --all
  --strict job should run on a full clone or accept STALE noise'
tradeoff_two_user_roots: 'NEW - Disadvantage: until the legacy tenants move, a host
  carries ~/.aitask/ (venv, python, bin, uv) and ~/.aitasks/ (engine) side by side,
  and a user who deletes one to "reset" the framework removes half of it; mitigated
  by one variable (AITASKS_HOME) with one library owner, ait setup printing both roots
  in its summary, ENGINE_MISSING naming the exact path, and a test that fails if any
  script of this feature names ~/.aitask/'
tradeoff_axis_projection_coarseness: 'NEW - Disadvantage: the default axis join is
  file-level - a one-key edit to values-ru/strings.xml selects every screen on both
  ru matrices (about 65 variants) rather than the screens naming that key; sound but
  2/10 of the matrices rather than 1/50 of the screens; mitigated by the opt-in android-res
  symbol scanner (keys changed -> referencing Kotlin files -> member units), by select
  --format tokens feeding the project''s own render loop so the over-selection costs
  a preview rather than a gate, and by the budget knobs'
tradeoff_whole_run_filter_soundness: 'NEW - Risk: where a runner''s filter restricts
  a whole test run (Gradle --tests on thinking_app''s single testDebugUnitTest task),
  every class not selected is silently not run, so a narrow selection is only as sound
  as the test-side closure, the reads globs and the opaque contract; mitigated by
  list enumerating the whole universe so an unlisted class fails check, the test-dep
  closure over abstract bases and helpers, testmap:reads on tree-scanning helpers
  (57 SourceFence classes stay selected on any Kotlin change), ESCALATE on opaque
  files, red-proof fixtures per branch, and the project keeping its full suite as
  the completion gate until readiness is met'
tradeoff_member_annotation_drift: 'NEW - Risk: a member unit''s annotation lives in
  a block keyed by name (testmap:unit Welcome) and the runner''s list keys the same
  member by another artifact (the golden manifest''s Welcome_<matrix>.png); a rename
  on one side orphans the other; mitigated by check reporting a listed member with
  no block (UNANNOTATED_MEMBER) and a block with no listed member (DEAD_MEMBER), both
  fail-closed, and by scan --apply refusing rather than guessing'
