description: Best-of-both synthesis of the two explore_002 answers on n003's base
  - the engine under $AITASKS_HOME/engine/v<VERSION>/ (default ~/.aitasks, one owner
  file, no legacy fallback; n005) with n004's home migration shipped as an explicit
  ait engine home --migrate whose known-entry set gains pypy_venv and whose default
  flip is a named follow-up, and thinking_app's screen x matrix subdivision carried
  by n005's member units and variant axes (runner list as the universe, per-variant
  evidence, test-side closure, fail-closed Kotlin scanner, automatic prediction scoring,
  readiness) with n004's invocation-group costing, facet reason on every row, UNCOVERED_VALUE/UNMAPPED_ARTIFACT
  reconciliation, testmap:axis and --axis bridged in; chosen because a Gradle --tests
  filter drops every unselected class and only n005's model makes that omission justifiable,
  and because n004's cells sat outside the stamp-and-evidence model entirely.
