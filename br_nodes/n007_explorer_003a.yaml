description: 'n006 plus the missing adoption layer: an attended, resumable, task-shaped
  onboarding skill (aitask-testmap-onboard) that detects a repo''s test tools, generates
  aitestmap/ (runners, bindings, areas, config) and seeds edges from four measured
  sources (naming, literal invocation / imports, (t<id>) co-change history, opt-in
  per-unit coverage) into a generated seeded.yaml that selects immediately but never
  evidences; acceptance promotes seeds into testmap: lines in batches or incrementally
  inside the testmap_fresh gate; one agent-facing front verb (ait test --task|--all|<paths>|brief)
  plus a generic ''Running Tests'' section in the seeded agent-instructions block
  so every agent learns the run surface once; and a single workflow helper (aitask_affected_tests.sh)
  wired into task-workflow Step 7 behind an affected_tests profile key, aitask-qa''s
  test discovery/execution, and ait setup''s TESTMAP: state line - degrading to a
  reported skip wherever the engine or registry is absent.'
