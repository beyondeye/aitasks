description: Best-of-both synthesis - the ait-testmap Go engine built from engine/
  and installed per framework version off PATH, per-edge blob-digest stamps as the
  staleness key with committed run evidence as the healing anchor through a new evidence-join
  component, and broad tests as scoped rows in the one registry directory selected
  under an explicit suite budget and run after the unit wave.
