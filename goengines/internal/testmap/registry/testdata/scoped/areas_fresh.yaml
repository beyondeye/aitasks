# Areas: named glob sets that broad tests name with testmap:area.
# Seeded by ait-testmap areas --import-codemap; hand edits are kept on re-import.
contract: 1
areas:
  board:
    paths: [.aitask-scripts/board/**]
  board_tests:
    paths: [tests/board/**]
  scripts:
    paths: [.aitask-scripts/**]
