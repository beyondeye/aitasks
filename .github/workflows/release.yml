name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  goengines:
    needs: plan
    runs-on: ubuntu-latest
    env:
      # go.mod names `toolchain go1.27.1`; auto makes the go command switch to it.
      GOTOOLCHAIN: auto
    defaults:
      run:
        working-directory: goengines
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: goengines/go.mod
          cache-dependency-path: goengines/go.sum

      - name: Go version
        run: go version

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build engine release assets
        run: |
          ./build.sh all
          cd dist
          sha256sum -c ait-testmap_*_SHA256SUMS.txt

      - name: Upload engine release assets
        uses: actions/upload-artifact@v4
        with:
          name: goengines-dist
          path: goengines/dist/
          if-no-files-found: error

  release:
    needs: [plan, goengines]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download engine release assets
        uses: actions/download-artifact@v4
        with:
          name: goengines-dist
          path: goengines/dist

      - name: Verify VERSION file matches tag
        run: |
          file_version=$(cat .aitask-scripts/VERSION)
          tag_version="${{ needs.plan.outputs.version }}"
          if [ "$file_version" != "$tag_version" ]; then
            echo "ERROR: VERSION file ($file_version) does not match tag ($tag_version)"
            exit 1
          fi

      - name: Build skills directory from .claude/skills
        run: |
          mkdir -p skills
          for skill_dir in .claude/skills/*/; do
            skill_name="$(basename "$skill_dir")"
            cp -r "$skill_dir" "skills/$skill_name"
          done

      - name: Build codex skills directory from .agents/skills
        run: |
          if [ -d .agents/skills ]; then
            mkdir -p codex_skills
            for skill_dir in .agents/skills/*/; do
              [ -d "$skill_dir" ] || continue
              skill_name="$(basename "$skill_dir")"
              cp -r "$skill_dir" "codex_skills/$skill_name"
            done
            # Copy shared helper docs (codex)
            for doc in codex_tool_mapping.md; do
              if [ -f ".agents/skills/$doc" ]; then
                cp ".agents/skills/$doc" "codex_skills/$doc"
              fi
            done
          fi

      - name: Build opencode skills directory from .opencode/skills
        run: |
          mkdir -p opencode_commands
          if [ -d .opencode/commands ]; then
            cp -r .opencode/commands/. opencode_commands/
          fi
          if [ -d .opencode/skills ]; then
            mkdir -p opencode_skills
            for skill_dir in .opencode/skills/*/; do
              [ -d "$skill_dir" ] || continue
              skill_name="$(basename "$skill_dir")"
              cp -r "$skill_dir" "opencode_skills/$skill_name"
            done
            if [ -f .opencode/skills/opencode_tool_mapping.md ]; then
              cp .opencode/skills/opencode_tool_mapping.md opencode_skills/opencode_tool_mapping.md
            fi
            if [ -f .opencode/skills/opencode_planmode_prereqs.md ]; then
              cp .opencode/skills/opencode_planmode_prereqs.md opencode_skills/opencode_planmode_prereqs.md
            fi
          fi

      - name: Create release tarball
        run: |
          tar -czf aitasks-${{ github.ref_name }}.tar.gz \
            ait \
            CHANGELOG.md \
            .aitask-scripts/ \
            packaging/ \
            skills/ \
            seed/ \
            codex_skills/ \
            opencode_skills/ \
            opencode_commands/

      - name: Extract changelog for this version
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            # Extract section between "## vX.Y.Z" and next "## v" heading (or EOF)
            section=$(sed -n "/^## v${version}$/,/^## v/{
              /^## v${version}$/d
              /^## v/d
              p
            }" CHANGELOG.md)
            if [ -n "$section" ]; then
              echo "$section" > /tmp/release_notes.md
              echo "found=true" >> $GITHUB_OUTPUT
            else
              echo "found=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release (with changelog)
        if: steps.changelog.outputs.found == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            aitasks-${{ github.ref_name }}.tar.gz
            packaging/shim/ait
            goengines/dist/*
          fail_on_unmatched_files: true
          body_path: /tmp/release_notes.md

      - name: Create GitHub Release (auto-generated notes)
        if: steps.changelog.outputs.found != 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            aitasks-${{ github.ref_name }}.tar.gz
            packaging/shim/ait
            goengines/dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  packaging:
    needs: [plan, release]
    uses: ./.github/workflows/release-packaging.yml
    secrets: inherit
    with:
      version: ${{ needs.plan.outputs.version }}
