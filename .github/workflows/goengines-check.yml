name: Go engines check

# Two modes, keyed on one signal: whether goengines/EXPORT.txt exists
# (.github/scripts/goengines_integrity.sh mode).
#
# Legacy mode (no EXPORT.txt — goengines/ is developed here): the check job
# (gofmt, vet, the hang-guard preflight, go test, the release cross-build and
# the repository-side guards) and the advisory bench job run, and
# export-integrity only reports that it is in legacy mode.
#
# Export mode (EXPORT.txt present — goengines/ is generated from aitasks_go,
# whose private gate ran the tests at the exported commit): check and bench
# are skipped and export-integrity is the validation — the integrity checks
# (required), the EXPORT.txt drift report (a warning, never blocking) and the
# guards over the public files that still exist.
#
# check and bench are skipped only on a positive `export` answer: if the mode
# job fails, its output is empty and they run in full.
#
# The paths list names release.yml, the t1954 research corpus, the integrity
# script and the guard tests too, so an edit to what the guards protect (or to
# the guards themselves) still runs them.
on:
  push:
    paths:
      - 'goengines/**'
      - '.github/workflows/goengines-check.yml'
      - '.github/workflows/release.yml'
      - 'tests/test_goengines_build.sh'
      - 'tests/test_goengines_benchci.sh'
      - 'tests/test_goengines_dashcheck.sh'
      - 'tests/test_release_workflow_goengines.py'
      - 'aidocs/testing_engine/t1954_parser_research/corpus/**'
      - 'tests/test_annot_conformance_corpus_sync.sh'
      - '.github/scripts/**'
      - 'tests/test_goengines_export_integrity.sh'
  pull_request:
    paths:
      - 'goengines/**'
      - '.github/workflows/goengines-check.yml'
      - '.github/workflows/release.yml'
      - 'tests/test_goengines_build.sh'
      - 'tests/test_goengines_benchci.sh'
      - 'tests/test_goengines_dashcheck.sh'
      - 'tests/test_release_workflow_goengines.py'
      - 'aidocs/testing_engine/t1954_parser_research/corpus/**'
      - 'tests/test_annot_conformance_corpus_sync.sh'
      - '.github/scripts/**'
      - 'tests/test_goengines_export_integrity.sh'
  workflow_dispatch:
    inputs:
      seed_regression:
        description: 'Bench against a baseline with every non-calibration line divided by 2.1 (a seeded regression sample)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # go.mod names `toolchain go1.27.1`; auto makes the go command switch to it
  # whatever version setup-go installed.
  GOTOOLCHAIN: auto

jobs:
  mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect goengines mode
        id: mode
        run: .github/scripts/goengines_integrity.sh mode

  check:
    needs: mode
    if: ${{ !cancelled() && needs.mode.outputs.mode != 'export' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goengines
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: goengines/go.mod
          cache-dependency-path: goengines/go.sum

      - name: Go version
        run: go version

      - name: gofmt
        run: |
          unformatted="$("$(go env GOROOT)/bin/gofmt" -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The hang-guard tripwire alone, so a process-starting test that omits
      # the guard fails here in seconds instead of hanging the suite below.
      - name: Hang-guard preflight
        run: ./ci/preflight.sh

      # The pytest adapter's real-tool tests (G10) run against exactly these
      # versions; they are installed before the suite, which requires them.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned pytest (real-tool adapter tests)
        run: python -m pip install pytest==8.4.2 pytest-xdist==3.8.0

      # Real-tool adapter tests (G10): a missing tool fails here, never skips.
      - name: go test
        env:
          AIT_TESTMAP_REQUIRE_REAL_TOOLS: '1'
        run: go test ./...

      - name: Release cross-build
        run: |
          ./build.sh all --out "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP/dist"
          # One sums file per executable under cmd/; none at all is a failure.
          sums=(*_SHA256SUMS.txt)
          [ -e "${sums[0]}" ] || { echo "no SHA256SUMS files"; exit 1; }
          for s in "${sums[@]}"; do sha256sum -c "$s"; done

      - name: Release workflow structure guard
        working-directory: .
        run: |
          python -m pip install pyyaml
          python -m unittest tests/test_release_workflow_goengines.py

      - name: build.sh tests
        working-directory: .
        run: bash tests/test_goengines_build.sh

      - name: benchci.sh tests
        working-directory: .
        run: bash tests/test_goengines_benchci.sh

      # Stubbed: needs neither docker nor Go (the dash run itself is local only).
      - name: dashcheck.sh tests
        working-directory: .
        run: bash tests/test_goengines_dashcheck.sh

      - name: annot conformance corpus sync guard
        working-directory: .
        run: bash tests/test_annot_conformance_corpus_sync.sh

      - name: export integrity script tests
        working-directory: .
        run: bash tests/test_goengines_export_integrity.sh

  export-integrity:
    # Required in export mode; in legacy mode the check step reports legacy
    # and exits 0. Never advisory, never skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: goengines/go.mod
          cache-dependency-path: goengines/go.sum

      - name: Detect goengines mode
        id: mode
        run: .github/scripts/goengines_integrity.sh mode

      - name: Export integrity
        run: .github/scripts/goengines_integrity.sh check

      # A drifted file is an emergency public fix not yet returned to
      # aitasks_go: a warning, never a failure (goengines/README.md).
      - name: Drift report
        continue-on-error: true
        run: .github/scripts/goengines_integrity.sh drift

      # The guards over public files that outlive the cutover; in legacy mode
      # the check job runs them.
      - name: Setup Python
        if: steps.mode.outputs.mode == 'export'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Release workflow structure guard
        if: steps.mode.outputs.mode == 'export'
        run: |
          python -m pip install pyyaml
          python -m unittest tests/test_release_workflow_goengines.py

      - name: build.sh tests
        if: steps.mode.outputs.mode == 'export'
        run: bash tests/test_goengines_build.sh

      - name: export integrity script tests
        if: steps.mode.outputs.mode == 'export'
        run: bash tests/test_goengines_export_integrity.sh

  bench:
    needs: mode
    if: ${{ !cancelled() && needs.mode.outputs.mode != 'export' }}
    runs-on: ubuntu-latest
    # ADVISORY: the host-normalized gate is not yet proven portable across
    # hosted runners. It becomes a required check only once t1878 meets the
    # promotion criteria in goengines/README.md "Host normalization".
    continue-on-error: true
    defaults:
      run:
        working-directory: goengines
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: goengines/go.mod
          cache-dependency-path: goengines/go.sum

      - name: Go version
        run: go version

      - name: Prepare baseline
        env:
          SEED: ${{ inputs.seed_regression && 'true' || 'false' }}
        run: |
          if [ "$SEED" = true ]; then
            ./ci/benchci.sh seed bench/baseline.txt "$RUNNER_TEMP/baseline.txt"
          else
            cp bench/baseline.txt "$RUNNER_TEMP/baseline.txt"
          fi

      - name: Benchmark gate
        run: |
          set -o pipefail
          go run ./internal/tools/benchgate -baseline "$RUNNER_TEMP/baseline.txt" 2>&1 | tee "$RUNNER_TEMP/bench.out"

      - name: Job summary
        if: always()
        env:
          SEED: ${{ inputs.seed_regression && 'true' || 'false' }}
        run: |
          {
            echo "## Benchmark gate"
            echo
            if [ "$SEED" = true ]; then echo "Mode: **seeded regression** (every non-calibration baseline / 2.1)"; else echo "Mode: healthy"; fi
            echo
            echo "- CPU: $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')"
            echo "- nproc: $(nproc)"
            echo
            ./ci/benchci.sh summary "$RUNNER_TEMP/baseline.txt" "$RUNNER_TEMP/bench.out"
            echo
            echo '<details><summary>Raw gate output</summary>'
            echo
            echo '```'
            cat "$RUNNER_TEMP/bench.out" 2>/dev/null || echo "(no gate output)"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
