# Recorded by `website/screenshots.sh recipe save` from a capture that worked.
# Do not edit a failing recipe by hand: re-discover the route and save with --replace.
id: tui_switcher_from_monitor
output: aitasks_tui_switcher_from_monitor.svg
title: aitasks monitor
size:
- 140
- 40
dataset: agents
setup:
- ./.aitask-scripts/aitask_gate.sh materialize-active 14 --profile aitasks/metadata/profiles/fast.yaml && ./.aitask-scripts/aitask_gate_record.sh 14 plan_approved pass type=human && ./.aitask-scripts/aitask_gate.sh materialize-active 15 --profile aitasks/metadata/profiles/fast.yaml && ./.aitask-scripts/aitask_gate_record.sh 15 plan_approved pass type=human
launch: ./ait ide
steps:
- wait:
    text: tmux Monitor
    timeout: 60
    pane: monitor.0
- window_new:
    name: board
    command: ./ait board
- wait:
    text: fix login
    timeout: 60
    pane: board
- keys:
    keys:
    - Down
    - p
    pane: board
- wait:
    text: Pick Task t14
    pane: board
- wait:
    text: (R)un in tmux
    pane: board
- wait:
    text: lumen
    pane: board
- keys:
    keys:
    - r
    pane: board
- wait:
    text: IMPLEMENT
    pane: agent-pick-14.1
- keys:
    keys:
    - Right
    - p
    pane: board
- wait:
    text: Pick Task t15
    pane: board
- wait:
    text: (R)un in tmux
    pane: board
- wait:
    text: lumen
    pane: board
- keys:
    keys:
    - r
    pane: board
- wait:
    text: 't15: cache product images'
    pane: monitor.0
- wait_gone:
    text: agent unresolved
    timeout: 40
    pane: monitor.0
- keys:
    keys:
    - Down
    pane: monitor.0
- wait:
    text: 12 passed in 1.84s
    pane: monitor.0
- keys:
    keys:
    - j
    pane: monitor.0
- wait:
    text: TUI Switcher
    pane: monitor.0
- wait:
    text: J/Esc close
    pane: monitor.0
expect:
- TUI Switcher
- tmux Monitor
- CODE AGENTS (2)
- agent-pick-14
- Enter switch  J/Esc close
illustrates: 'The TUI switcher opened with j from the monitor while two code agents run: the TUI list with monitor marked as the current one, the running agent windows below it, and a hint row without Shift+M, which is offered from every other TUI.'
capture:
  window: monitor
