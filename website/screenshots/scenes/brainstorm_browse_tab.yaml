id: brainstorm_browse_tab
output: aitasks_brainstorm_browse_tab.svg
title: aitasks brainstorm
size:
- 140
- 50
dataset: brainstorm
setup: []
launch: ./ait brainstorm 9
steps:
- wait:
    text: n003_hybrid HEAD
    timeout: 60
- wait: 'Node: n000_init'
- keys:
  - Down
- wait: Set HEAD
- keys:
  - Down
- wait: 'Node: n001_numbered_pages'
- keys:
  - Down
- wait: 'Node: n003_hybrid'
- wait: deep_pages
expect:
- (B)rowse
- n001_numbered_pages
- n002_load_more
- n003_hybrid HEAD
- 'Node: n003_hybrid'
- 'Parents: n001_numbered_pages, n002_load_more'
- 'Generated by: synthesize'
- deep_pages
illustrates: 'The brainstorm Browse tab: the graph of proposal nodes on the left (a root, two explorations and a hybrid that merges them, marked HEAD) and, on the right, the session status and the selected node''s details with its dimensions.'
