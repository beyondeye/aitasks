# aitask framework — Codex CLI configuration seed
# This file is merged into .codex/config.toml during `ait setup`
# Only aitask-specific settings are included here

# Sandbox: allow writes to workspace + network access (needed for git push, web search)
sandbox_mode = "workspace-write"

[features]
default_mode_request_user_input = true

[sandbox_workspace_write]
network_access = true

# Codex TUI: disable ONLY the composer "starfield" (t1797, narrowed by t1944).
# For Astra-family models Codex draws animated Braille dots around the idle
# composer; the glyphs are visible characters, so `ait monitor` /
# `ait minimonitor` never read an idle Codex pane as idle and the shadow
# auto-recheck loop never sees it as ready. `whimsy` is the codex-cli 0.154 key
# (0.160 keeps it as an alias); `effects.starfield` is the 0.160 key.
# Never set `animations = false` here: it is Codex's master switch and also
# stops the `Working (Ns …)` timer from ticking, so a working pane reads idle.
# `ait codeagent invoke` passes the same keys (plus `tui.animations=true`) as
# `-c` overrides, which outrank this file; this block covers Codex sessions
# started by hand in the project. `ait setup` adds each key only when absent
# (copying the project's value when it sets the other spelling), and removes
# once the `[tui] animations = false` the t1797 seed wrote (a `[tui]` with
# `animations = false` and neither `whimsy` nor `effects`).
[tui]
whimsy = false

[tui.effects]
starfield = false

# Protective rules for destructive commands.
# Aitasks helper allow rules live in .codex/rules/default.rules.

[[rules.prefix_rules]]
pattern = [{ token = "rm" }, { any_of = ["-rf", "-r", "-fr"] }]
decision = "prompt"
justification = "Recursive deletion requires approval"

[[rules.prefix_rules]]
pattern = [{ token = "git" }, { token = "push" }, { token = "--force" }]
decision = "prompt"
justification = "Force push requires approval"

[[rules.prefix_rules]]
pattern = [{ token = "git" }, { token = "reset" }, { token = "--hard" }]
decision = "prompt"
justification = "Hard reset requires approval"

# SessionStart hook — records the codeagent session id into the framework
# session store so a frozen agent can later be restored (`codex resume <id>`).
#
# TIMING (measured on codex 0.163.0): the interactive TUI fires this at a
# session's FIRST TURN, not at launch. That is `startup` for a new session, and
# `resume` after `codex resume`. Codex 0.153.4 fired it only under
# `codex exec`, never in the TUI. On an older codex the freeze engine reads the
# session from the rollout the agent's own process holds open instead (Linux
# only). Before a session's first turn there is no rollout either, so an agent
# frozen then has no session to resume, and a restore re-picks its task.
#
# The command is REPO-RELATIVE on purpose: .codex/config.toml is a tracked,
# framework-committed file and codex has no $CLAUDE_PROJECT_DIR equivalent, so
# an absolute path would commit a developer's home directory.
#
# The hook also requires the project to be trusted:
#   [projects."<realpath>"] trust_level = "trusted"   in $CODEX_HOME/config.toml
# which is outside `ait setup`'s remit — it never writes the user's codex home.

[[hooks.SessionStart]]
matcher = "startup|resume"

[[hooks.SessionStart.hooks]]
type = "command"
command = ".aitask-scripts/aitask_session_hook.sh"
timeout = 10
