  \ 2026-09-15 09:25\n    backend: local\n---\n\nDesign and build a generic **selective\
  \ testing** subsystem for the aitasks\nframework: a maintained relation between\
  \ source files and test units, a\nmechanical translation from a task's change set\
  \ to the ranked set of tests\nthat must run (with a reason on every line), a standard\
  \ runner contract with a\nrunner repository and per-test runner assignment, declared\
  \ concurrency\nresources, per-test cost tracking by host class, a failure feedback\
  \ loop, two\nenforcing gates, and an agent skill that keeps the map current.\n\n\
  **This task is being designed through `ait brainstorm`.** The seed proposal\n(three\
  \ rounds of design discussion on 2026-09-15) is attached to this task as\n`selective_testing_proposal.md`\
  \ and imported as the brainstorm root node\n`n000_init`. The design is deliberately\
  \ NOT final; the brainstorm holds the\nopen questions.\n\n## Why\n\nEvery target\
  \ repo runs either its whole suite per task or nothing. This repo\nhas ~415 shell\
  \ and ~335 python test files and `test_command: null`, so nothing\ngates. thinking_app\
  \ has one ~8 minute heavy gate; its blast-radius rules live\nonly in prose. Naming\
  \ conventions (`tests/test_gate_pass.sh` tests\n`aitask_gate_pass.sh`) are the only\
  \ source-to-test knowledge, and nothing\ntracks when it rots.\n\n## Targets\n\n\
  aitasks, thinking_app, thinking_backend, aitasks_go, aitasks_mobile. Between\nthem:\
  \ one-process-per-file bash tests, batched pytest modules, Go packages\nwith `-run`\
  \ regexes, Gradle class FQNs behind a host lock with memory\nadmission, selector-less\
  \ whole suites, and device tests needing an allocated\nemulator.\n\n## Decisions\
  \ taken so far\n\n- Registry lives in the code tree under `aitestmap/`, as a directory\
  \ whose\n  files are merged; `_scanned.yaml` is written only by scanning in-test\n\
  \  `testmap:covers` annotations, hand files declare `owns:` globs.\n- Selection\
  \ is a graded graph walk (distance per unit, cut knobs applied\n  afterwards), not\
  \ hand-typed basic/deep/deepest labels and not profile tiers.\n- Blast radius is\
  \ data: rules with `select`, `implies`, `escalate` effects.\n- Static scanners plus\
  \ manual attribution via skills; fail-closed with\n  expiring waivers; full-run\
  \ machinery for CI or on demand.\n- Runner contract: `describe`, `list`, `run --manifest\
  \ --out`; results as\n  run-id-stamped JSONL; exit contract 0/1/2/75 as in thinking_app.\n\
  - Concurrency as declared resources (mutex, semaphore, admission, allocator;\n \
  \ scopes host, worktree, run; `acquired_by` for wrapped locks) with a\n  `schedule`\
  \ report that characterises waves and critical path.\n- Cost per execution unit\
  \ with Welford stats, keyed by host class.\n\n## Open questions (see brainstorm)\n\
  \nSymbol-level granularity; sufficiency of the three rule effects; concurrent\n\
  versus serial-with-report scheduler in v1; routing of new declared edges;\ndevice-unit\
  \ default policy; committed versus local cost summaries; CI\nevidence format; how\
  \ the thinking_app screenshot gate is wrapped; the per-repo\nbootstrap procedure.\n\
  \nExpected outcome of the brainstorm: a finalized proposal exported to `aiplans/`\n\
  and a decomposition into child tasks (registry and CLI, scanners, selector,\nrunner\
  \ contract plus reference runners, scheduler and resources, cost ledger,\ngates,\
  \ skill, per-repo bootstrap).\n"
